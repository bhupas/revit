# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# Installer manifest for nullCarbon Revit Export.
#
# The MSI is a per-user WiX v5 build produced by scripts\build-installer.ps1.
# It installs to %LocalAppData%\nullCarbon-LCA-Export\<year>\ without
# elevation. The UpgradeCode below is pinned in setup\nullcarbon\nullcarbon-installer.wxs
# and MUST stay stable across versions -- winget relies on it to match
# future upgrades.
#
# ProductCode regenerates per build (WiX Component Guid="*"), so it is
# filled in per version by scripts\inspect-msi.ps1 after the CI MSI
# publishes.

PackageIdentifier: nullCarbon.RevitExport
PackageVersion: 26.5.0

InstallerType: wix
Scope: user
InstallModes:
  - silent
  - silentWithProgress
UpgradeBehavior: install

# Install switches for `winget install`. Match the silent flags
# NullCarbonUpdater already passes to msiexec.
InstallerSwitches:
  Silent: /qn /norestart
  SilentWithProgress: /passive /norestart

# Release artifacts live under
#   https://github.com/bhupas/revit/releases/download/v<version>/
# and are named nullCarbon-LCA-Export-win64-<version>.msi.
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/bhupas/revit/releases/download/v26.5.0/nullCarbon-LCA-Export-win64-26.5.0.msi
    InstallerSha256: 421C7EAC396B44C96FE2D5468E9649D88E2F3FB1B15E39B51CD10BB2924274B7
    ProductCode: '{76F55987-65A6-40F2-A34D-ECB6E4EE9BCD}'
    UpgradeCode: B4F7A2E1-3C8D-4A5F-9E2B-7F1C8D3E5A92

ReleaseDate: 2026-10-08
ManifestType: installer
ManifestVersion: 1.6.0
